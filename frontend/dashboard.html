<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-bg">

    <!-- Header -->
    <div class="dashboard-header d-flex justify-content-between align-items-center px-4 py-3">
        <h4 class="text-white mb-0">Todo Dashboard</h4>
        <button class="btn btn-outline-light" onclick="logout()">Logout</button>
    </div>

    <!-- Task Input -->
    <div class="container mt-5 d-flex justify-content-center">
    <div class="card shadow p-4 w-75">
        <div class="d-flex justify-content-center align-items-center gap-3">
            
            <input
                type="text"
                id="taskInput"
                class="form-control text-center custom-input"
                placeholder="Enter your task"
            >
            
            <button 
                class="btn btn-primary custom-btn"
                onclick="addTask()"
            >
                Add Task
            </button>

        </div>
    </div>
</div>


        <!-- Task List -->
        <ul class="list-group mt-4" id="taskList"></ul>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
